<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Records · MiniMusicLibrary</title>
</head>
<body data-page="records">
<div id="site-header"></div>
<main>
  <div class="page-head"><div class="wrap">
    <div><h1 style="font-size:clamp(44px,6vw,84px)">Records</h1><p>Everything on the wall, new and used. Used records show vinyl / sleeve condition.</p></div>
  </div></div>
  <div class="wrap shop">
    <form class="filters" id="filters" aria-label="Filter records" onsubmit="return false"></form>
    <div>
      <div class="toolbar">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <button class="btn ghost filters-toggle" type="button" aria-expanded="false" aria-controls="filters" style="height:42px">Filters</button>
          <span id="result-count" aria-live="polite"></span>
        </div>
        <label>Sort <select id="sort">
          <option value="added">Newest on the wall</option>
          <option value="price-asc">Price, low to high</option>
          <option value="price-desc">Price, high to low</option>
          <option value="artist">Artist, A to Z</option>
          <option value="year">Release year, newest</option>
        </select></label>
      </div>
      <div class="active-chips" id="chips" style="margin-bottom:24px"></div>
      <div class="grid" id="results"></div>
      <div class="empty" id="empty" hidden>
        <h2>No records match these filters.</h2>
        <p>Try removing a filter or raising the price limit.</p>
        <button class="btn" id="empty-reset" type="button">Clear all filters</button>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
